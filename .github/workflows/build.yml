name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run lint
      - name: Clean-build installer
        run: npm run build:clean
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolTime-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Attach installer to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${{ github.ref_name }}" release/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
