<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SchoolTime</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">SCHOOLTIME</p><h1>우리 반 시간표</h1><p class="sub">학교를 검색하고 이번 주 수업과 담당 선생님을 확인하세요.</p></div><span class="badge">오픈소스 · 로컬 우선</span></header>
<section class="controls"><label>학교 검색<input id="schoolQuery" maxlength="60" placeholder="예: 서울고등학교" autocomplete="off"></label><button id="searchButton">검색</button><label>학년<select id="grade"><option value="1">1학년</option><option value="2">2학년</option><option value="3">3학년</option></select></label><label>반<input id="classNo" type="number" min="1" max="50" value="1"></label><button id="loadButton" disabled>시간표 보기</button></section>
<p id="status" class="status" role="status">학교 이름을 검색해 주세요.</p><section><h2 id="selectedSchool">검색 결과</h2><div id="schoolResults" class="school-results"></div></section><section class="timetable-wrap"><h2>주간 시간표</h2><div id="timetable" class="empty">학교를 선택하면 시간표가 표시됩니다.</div></section></main><script src="app.js"></script></body></html>
